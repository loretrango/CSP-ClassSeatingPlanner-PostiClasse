<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Download PostiClasse</title>
</head>
<body>
  <script>
    const url = "https://raw.githubusercontent.com/loretrango/PostiClasse-SeatingPlanner/main/postiClasse.html";
    fetch(url)
      .then(r => r.blob())
      .then(blob => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "postiClasse.html";
        a.click();
      });
  </script>
  <p>Il download dovrebbe partire automaticamente…</p>
</body>
</html>
